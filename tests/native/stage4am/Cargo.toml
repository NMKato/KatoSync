[package]
name = "katosync_stage4am_real_inchannel_revoke_qa"
version = "0.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time", "io-util", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.12", features = ["v4"] }
zeroize = "1"
x509-parser = "0.18.1"
