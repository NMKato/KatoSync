name: KatoSync RC69 Native Signed Presence QA

on:
  pull_request:
    paths:
      - "src-tauri/src/mesh_rc67_presence_qa.rs"
      - "src-tauri/src/lib.rs"
      - "qa/rc69-presence-harness/**"
      - "tests/meshRc69PresenceWireContract.test.ts"
      - ".github/workflows/rc69-native-presence-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc69-native-presence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-jws-compatibility:
    name: Native Ed25519 wire contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Compile exact Desktop source and test signed presence with no network/device
        run: cargo test --locked --manifest-path qa/rc69-presence-harness/Cargo.toml --lib
