name: KatoSync PR Fast Gate

on:
  # Review stacked PRs targeting feature branches as well as dev/main.
  # Otherwise the current Mesh/Auth PR stack silently skips this gate.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katosync-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependency advisories (high and critical)
        run: npm audit --audit-level=high

      - name: Node regression suite (including KUAS and MCP/CLI)
        run: npm test

      - name: Server TypeScript security contract (if configured)
        run: npm run typecheck:server --if-present

      - name: TypeScript + Vite production build
        run: npm run build

  rust-format:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check native Rust source formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  windows-node-regression:
    name: Windows Node Regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Windows Node and MCP integration tests
        run: npm test

      - name: Windows server TypeScript security contract (if configured)
        run: npm run typecheck:server --if-present

      - name: Windows TypeScript
        run: npm run typecheck
