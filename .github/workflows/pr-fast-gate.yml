name: KatoSync PR Fast Gate

on:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katosync-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript + Vite production build
        run: npm run build
