name: Attribution Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify owner attribution or explicitly scoped KatoSync tooling
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            email="$(git show -s --format='%ae' "$sha")"
            author_name="$(git show -s --format='%an' "$sha")"
            committer_email="$(git show -s --format='%ce' "$sha")"
            committer_name="$(git show -s --format='%cn' "$sha")"
            message="$(git show -s --format='%B' "$sha")"
            if [ "$email" = "nmkato@web.de" ]; then
              :
            elif [ "$email" = "katosync@users.noreply.github.com" ] &&
                 [ "$author_name" = "NMKato Solutions" ] &&
                 [ "$committer_email" = "katosync@users.noreply.github.com" ] &&
                 [ "$committer_name" = "NMKato Solutions" ] &&
                 [ "$PR_AUTHOR" = "NMKato" ] &&
                 [ "$PR_HEAD_REPO" = "$REPOSITORY" ] &&
                 [[ "$PR_HEAD_REF" == security/* ]]; then
              echo "Approved scoped KatoSync tool attribution: $sha"
            else
              echo "::error::Commit $sha has unapproved attribution ($email / $author_name)."
              bad=1
            fi
            if printf '%s\n' "$message" | grep -Eiq '^[[:space:]]*co-authored-by[[:space:]]*:'; then
              echo "::error::Commit $sha includes an unapproved Co-authored-by trailer."
              bad=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$bad"
