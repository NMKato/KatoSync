name: Attribution Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require NMKato-only authorship
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            email="$(git show -s --format='%ae' "$sha")"
            message="$(git show -s --format='%B' "$sha")"
            if [ "$email" != "nmkato@web.de" ]; then
              echo "::error::Commit $sha author email is '$email'; only NMKato <nmkato@web.de> is allowed."
              bad=1
            fi
            if printf '%s\n' "$message" | grep -Eiq '^[[:space:]]*co-authored-by[[:space:]]*:'; then
              echo "::error::Commit $sha contains a Co-authored-by trailer. AI/tool co-authors are not allowed."
              bad=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$bad"
