[package]
name = "katosync"
version = "2.0.0"
description = "Project Memory Uploader for Agent Libraries"
authors = ["NMK Solutions"]
edition = "2021"

[lib]
name = "katosync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
keyring = { version = "3.6", features = ["apple-native"] }
lopdf = "0.34"
plist = "1.7"
rand = "0.8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
x509-parser = "0.18.1"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "net"] }
uuid = { version = "1.12", features = ["v4"] }
walkdir = "2.5"
zeroize = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[features]
github-login-qa = [] # Isolated local test app; never include in production builds
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
