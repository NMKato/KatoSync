[package]
name = "katosync-rc69-presence-harness"
version = "0.1.0"
edition = "2021"
publish = false

# QA-only micro-crate: compiles the EXACT native Desktop RC67 source without
# the expensive Tauri/macOS application dependencies and without a runtime.
[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["serde", "v4"] }
# RC70 exercises the EXACT production outbound transport with a loopback WS server.
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
